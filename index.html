<!-- isso e um comentario --> 
 <!-- avisa o navegador que o arquivo é do tipo html -->
<!DOCTYPE html>

<!-- atributo 'lang' define o idioma do arquivo -->
<html lang="pt-br">

<!-- area de configução do arquivo -->
<head>
    <!-- define a codificação de caracteres do arquivo -->
    <meta charset="UTF-8">
    <!-- visualização do arquivo em dispositivos móveis -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- titulo do arquivo -->
    <title>AULA-01-HTML </title> 
</head>

<!-- conteúdo dentro da pagina -->
<body>
    o escuro e preto, o claro e branco, o cinza e neutro vermelho e quente, o azul e frio, o verde e natureza, o amarelo e alegria, o laranja e energia, o roxo e mistério, o rosa e delicadeza.
</body>
</html>
