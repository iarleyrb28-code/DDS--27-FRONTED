<!DOCTYPE html>
<html lanG="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--- TABELAS -->
    <header>
        <h1>Tabelas legais </h1>
    </header>

    <main> 
        <h2> TABELA DE PRODUTOS </h2> 
        <!-- TABLE = criação de tabela -->
         <!-- BORDER = borda da tabela -->
        <table border="8">  
        <!-- THEAD = CABEÇALHO DA TABELA -->
            <thead> 
        <!-- TR = CRIAÇÃO DE LINHA DA TABELA -->
                <tr> 
        <!-- TH = CRIAÇÃO DE UMA COLUNA DE UM CABEÇALHO -->
                    <th> ID </th>
                    <TH> NOME </TH>
                    <TH> QUANTIDADE </TH>
                    <TH> PREÇO </TH>
                    <TH> CATEGORIA </TH>

                </tr>
                <!-- tr*2>td*5-->
                 <tr>
                    <td> 1 </td>
                    <td> monitor </td>
                    <td> 3 </td>
                    <td> R$ caro </td>
                    <td> Essencial</td>
                 </tr>
                 <tr>
                    <td>  3  </td>
                    <!-- coldspan = diz quantas colunas a céluala vai ocupar-->
                    <td colspan="3"> Mucilon 500g </td>
                    <!-- rowspan = diz quantas linhas a céluala vai ocupar-->
                     <td rowspan="2"> Filhos </td>
                 </tr>
                 <tr>
                  <td> 4 </td>
                    <td> Lavador nasal </td>
                    <td> 1 </td>
                    <td> R$ 30</td>
                 </tr>
                 <tr>
            </thead>
            <!-- TBODY = CORPO DA TABELA -->
             <tbody> 
                <TR>   
                    <!-- TD = CÉLULA DA LINHA DO CORPO -->
                    <TD> 5 </TD>
                    <td> shampoo tralalá</td>
                    <td> 6 </td>
                    <td> R$ 67,00 </td>
                    <td> Cosmeticos </td>

                </TR>     
             </tbody>
             <!-- TFOOT = RODAPÉ DA TABELA -->
             <tfoot>
                 <tr>
                     <td coldspan="10"> Tabela feita por : ribeiro </td>
                 </tr>
             </tfoot>
        </table>
    </main>

    <footer>
        <p> AMO TODOS OS MENOR QUENTÕES </p>
    </footer>
</body>
</html>
