<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<header>
    <h1> Trabalhando com inputs </h1>
</header>

<!-- inputs -->
 <main> 
    <h2> Formulário de cadastro </h2>

    <!-- input = coleta infromações do usuário -->
    <!-- form = engloba os campos do formulário -->
    <!-- action = define para aonde vão as informações -->
    <!-- method = define como vão as informações -->
    <form action =" " method = " ">
        
    <!-- texto de apoio para guiar o input -->
     <!-- label sem input -->
        <label for = "NomeCompleto"></label> Nome Completo: </label>
        <!-- text = caracteres em geral -->
        <!-- name = usado para identificar o input qaundo enviar os dados -->
        <!-- id = identificação daquele elemento html -->
        <input type ="text" name = "NomeCompleto" id="NomeCompleto" >

        <br> <br>

    
    <!-- input dentro do label -->
     <label for = "">   
        Senha :
        <!-- password = senhas -->
        <input type = "password" name = "Senha" id = "Senha">
     </label>
    </form>

 </main>

 <footer>
    <p> INPUTS COMPLEMENTARES </p>
</footer>

</body>
</html>
